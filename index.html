<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scolastic AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a2a, #1a0a6b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 900px;
            height: 650px;
            background: #f0f4ff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }

        .top {
            background: linear-gradient(135deg, #1a0a6b, #2d1b8e);
            color: aliceblue;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
        }

        .top h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #94a3b8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .top-actions button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }

        .top-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .body {
            flex: 1;
            background: #f0f4ff;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .body::-webkit-scrollbar {
            width: 6px;
        }
        .body::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        .body::-webkit-scrollbar-thumb {
            background: #1a0a6b;
            border-radius: 8px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-agent {
            align-self: flex-start;
        }

        .message-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message .avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }

        .message-agent .avatar-small {
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
        }

        .message-user .avatar-small {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .message .bubble {
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message-agent .bubble {
            background: white;
            color: #1a0a6b;
            border-bottom-left-radius: 4px;
        }

        .message-user .bubble {
            background: #1a0a6b;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message .timestamp {
            display: block;
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        .message-user .timestamp {
            color: rgba(255, 255, 255, 0.6);
        }

        .bottom {
            background: white;
            padding: 16px 24px;
            border-top: 2px solid #e2e8f0;
            flex-shrink: 0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 12px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px 4px 4px 16px;
            border: 2px solid #e2e8f0;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #1a0a6b;
            box-shadow: 0 0 0 3px rgba(26, 10, 107, 0.1);
        }

        .box {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            font-size: 14px;
            color: #1e293b;
            resize: none;
            outline: none;
            min-height: 40px;
            max-height: 120px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .box::placeholder {
            color: #94a3b8;
        }

        .button {
            background: linear-gradient(135deg, #1a0a6b, #2d1b8e);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            height: 44px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 10, 107, 0.3);
        }

        .button:active {
            transform: scale(0.96);
        }

        /* Typing animation for bubbles */
        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .app {
                height: 95vh;
                border-radius: 12px;
            }
            .top {
                padding: 12px 16px;
            }
            .top h1 {
                font-size: 16px;
            }
            .body {
                padding: 12px 16px;
            }
            .message {
                max-width: 90%;
            }
            .bottom {
                padding: 12px 16px;
                flex-direction: column;
                gap: 8px;
            }
            .input-wrapper {
                padding: 4px 4px 4px 12px;
                width: 100%;
            }
            .button {
                width: 100%;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="top">
            <div class="top-left">
                <div class="avatar">AI</div>
                <div>
                    <h1>Scolastica - AI Agent</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        <span id="connectionStatus">Connecting...</span>
                    </div>
                </div>
            </div>
            <div class="top-actions">
                <button onclick="resetChat()">New Chat</button>
            </div>
        </div>

        <div class="body" id="chatBody">
            <div class="message message-agent">
                <div class="avatar-small">AI</div>
                <div class="bubble">
                    Hello! I'm your Scolastic AI assistant. How can I help you with your studies today?
                    <span class="timestamp">Just now</span>
                </div>
            </div>
        </div>

        <div class="bottom">
            <div class="input-wrapper">
                <textarea class="box" id="userInput" placeholder="Type your query here..." rows="1"></textarea>
                <button class="button" id="sendButton">SUBMIT QUERY</button>
            </div>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chatBody');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const connectionStatus = document.getElementById('connectionStatus');

        // Check backend connection
        async function checkConnection() {
            try {
                const response = await fetch('http://localhost:5000/api/health');
                if (response.ok) {
                    connectionStatus.textContent = 'Online ✅';
                    connectionStatus.style.color = '#22c55e';
                } else {
                    connectionStatus.textContent = 'Backend Error ❌';
                    connectionStatus.style.color = '#ef4444';
                }
            } catch (error) {
                connectionStatus.textContent = 'Offline ❌';
                connectionStatus.style.color = '#ef4444';
                console.log('Backend not running. Start with: python app.py');
            }
        }

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Send message to backend
        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            // Disable button during processing
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message message-user';
            userMsg.innerHTML = `
                <div class="avatar-small">You</div>
                <div class="bubble">
                    ${text}
                    <span class="timestamp">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
            `;
            chatBody.appendChild(userMsg);

            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';

            // Add typing indicator
            const typingMsg = document.createElement('div');
            typingMsg.className = 'message message-agent';
            typingMsg.id = 'typingIndicator';
            typingMsg.innerHTML = `
                <div class="avatar-small">AI</div>
                <div class="bubble">
                    <span class="typing-dots">
                        <span></span><span></span><span></span>
                    </span>
                    <span class="timestamp">typing...</span>
                </div>
            `;
            chatBody.appendChild(typingMsg);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: text,
                        history: []
                    })
                });

                const data = await response.json();

                // Remove typing indicator
                const typingElement = document.getElementById('typingIndicator');
                if (typingElement) typingElement.remove();

                if (response.ok) {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message message-agent';
                    aiMsg.innerHTML = `
                        <div class="avatar-small">AI</div>
                        <div class="bubble">
                            ${data.reply.replace(/\n/g, '<br>')}
                            <span class="timestamp">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                    `;
                    chatBody.appendChild(aiMsg);
                } else {
                    // Show error from backend
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'message message-agent';
                    errorMsg.innerHTML = `
                        <div class="avatar-small">AI</div>
                        <div class="bubble" style="background: #fee2e2; color: #991b1b;">
                            ⚠️ Error: ${data.error || 'Something went wrong'}
                            <span class="timestamp">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                    `;
                    chatBody.appendChild(errorMsg);
                }
            } catch (error) {
                // Remove typing indicator
                const typingElement = document.getElementById('typingIndicator');
                if (typingElement) typingElement.remove();

                const errorMsg = document.createElement('div');
                errorMsg.className = 'message message-agent';
                errorMsg.innerHTML = `
                    <div class="avatar-small">AI</div>
                    <div class="bubble" style="background: #fee2e2; color: #991b1b;">
                        ❌ Can't connect to backend. Make sure it's running with: python app.py
                        <span class="timestamp">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                `;
                chatBody.appendChild(errorMsg);
                console.error('Error:', error);
            }

            // Re-enable button
            sendButton.disabled = false;
            sendButton.textContent = 'SUBMIT QUERY';
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Reset chat
        function resetChat() {
            const messages = chatBody.querySelectorAll('.message');
            messages.forEach((msg, index) => {
                if (index > 0) msg.remove(); // Keep only first message
            });
            chatBody.scrollTop = 0;

            // Optional: Reset on backend too
            fetch('http://localhost:5000/api/reset', {
                method: 'POST'
            }).catch(err => console.log('Reset not available'));
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Check connection when page loads
        checkConnection();
        // Check every 30 seconds
        setInterval(checkConnection, 30000);
    </script>

</body>
</html>
