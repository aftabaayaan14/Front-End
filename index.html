<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scolastic AI</title>
</head>
<style>
body {
    background-color: rgb(23, 64, 99);
    padding-bottom: 1%;
    padding-left: 5%;
    padding-right: 5%;
    padding-top: 1%;
}
.top {
    text-align: left;
    color: aliceblue;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
    background-color: rgb(26, 9, 121);
    margin: 0;
    padding-bottom: 0.25%;
    padding-left: 0.5%;
    padding-right: 0.25%;
    padding-top: 0.25%;
}
.body {
    background-color: rgb(36, 14, 160);
    margin: 0;
    padding-bottom: 0%;
    padding-right: 50%;
    padding-left: 2%;
    padding-top: 1%;
    margin: 0;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
}
.chatAgent {
    background-color: rgb(75, 126, 126);
    color: aliceblue;
    border-radius: 25px;
    padding: 2%;
    margin: 1;
}
.chat {
    background-color: rgb(48, 48, 48);
    color: aliceblue;
    border-radius: 25px;
    padding: 1%;
    margin: 1;
}
.bottom {
    background-color: rgb(26, 9, 121);
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    margin: 0;
    color: aliceblue;


}
.box {
    background-color: rgb(26, 9, 121);
    color: aliceblue;
    border-radius: 30px;
    padding: 1%;
    text-align: center;
}
.button {
    background-color: rgb(26, 9, 121);
    border-radius: 50px;
    padding: 1%;
    color: aliceblue;


}
</style>
<body>
    <div class="top">
    <h1>Scolastica - AI Agent</h1>
    </div>
    <div class="body">
        <div class="chatAgent">
             <label><H2>AI Agent :</H2>
                <text name="Userqueston" id="1">Hello! How can I help?</text>
             </label>
            
        </div>
        <br><br>
        <br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br>

        <div class="chat">
            <label><H2>Ask Agent </H2></label>
            <textarea name="Userqueston" id="1" class="box">Type in your query.</textarea>
            <br>
            <button name="Ask" id="2" class="button">SUBMIT QUERY</button>
        </div>
    </div>
</body>
